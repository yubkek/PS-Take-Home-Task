<a routerLink="/" class="back">← All candidates</a>
<h1>Add candidate</h1>

<form class="stack narrow" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label>
    Name
    <input formControlName="name" autocomplete="off" [attr.aria-invalid]="invalid('name')" />
    @if (invalid('name')) {
      <span class="field-error">Enter a name.</span>
    }
  </label>

  <div class="row">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="off" [attr.aria-invalid]="invalid('email')" />
      @if (invalid('email')) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>
    <label>
      Phone <span class="muted">(optional)</span>
      <input type="tel" formControlName="phone" autocomplete="off" />
    </label>
  </div>

  <div class="row">
    <label>
      Role applied for
      <input formControlName="role" list="roles" autocomplete="off" [attr.aria-invalid]="invalid('role')" />
      <datalist id="roles">
        @for (r of roles.value(); track r) {
          <option [value]="r"></option>
        }
      </datalist>
      @if (invalid('role')) {
        <span class="field-error">Enter the role.</span>
      }
    </label>
    <label>
      Source <span class="muted">(optional)</span>
      <input formControlName="source" list="sources" autocomplete="off" />
      <datalist id="sources">
        <option value="Referral"></option>
        <option value="LinkedIn"></option>
        <option value="Careers page"></option>
        <option value="Job board"></option>
      </datalist>
    </label>
  </div>

  @for (d of documents; track d.field) {
    <div class="stack">
      <label>
        {{ fileNames()[d.field] ? 'Text from ' + fileNames()[d.field] : d.title }}
        <span class="muted">(optional)</span>
        <textarea
          [formControlName]="d.field"
          [attr.name]="d.field"
          rows="10"
          [attr.aria-invalid]="invalid(d.field)"
        ></textarea>
        @if (invalid(d.field)) {
          <span class="field-error">Keep this under {{ maxResumeChars.toLocaleString() }} characters.</span>
        }
      </label>
      <label>
        Or upload a file <span class="muted">(.txt, .pdf, .docx, up to 5 MB)</span>
        <input type="file" accept=".txt,.pdf,.docx" [disabled]="uploading()" (change)="loadFile($event, d.field)" />
        @if (fileErrors()[d.field]) {
          <span class="field-error" role="alert">{{ fileErrors()[d.field] }}</span>
        }
      </label>
      @if (form.controls[d.field].value) {
        <div>
          <button type="button" [attr.aria-label]="'Remove ' + d.title" (click)="clear(d.field)">Remove</button>
        </div>
      }
    </div>
  }

  @if (uploading()) {
    <p class="muted" role="status">Reading file…</p>
  }

  @if (error()) {
    <p class="notice error" role="alert">{{ error() }}</p>
  }

  <div>
    <button type="submit" class="primary" [disabled]="saving() || uploading()">
      {{ saving() ? 'Saving…' : 'Add candidate' }}
    </button>
  </div>
</form>
